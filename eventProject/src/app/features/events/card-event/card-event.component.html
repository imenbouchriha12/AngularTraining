      <!-- Image -->
      <div class="image-container">
        <img [src]="e.imageUrl" [alt]="e.title" />
      </div>

      <!-- Contenu -->
      <div class="card-content">
        <h2 class="event-title">{{ e.title }}</h2>

        <div class="event-info">
          <p><strong>Date :</strong> {{ e.date | date: 'longDate' }}</p>
          <p><strong>Lieu :</strong> {{ e.location }}</p>
          <p><strong>Places :</strong> {{ e.nbPlaces }}</p>
        </div>

        <!-- Prix et actions -->
        <div class="card-footer">
          <div class="price">{{ e.price }} DT</div>

          <div class="actions">
            <button
              class="buy-btn"
              [disabled]="e.nbPlaces === 0"
              (click)="nbPlace(e)"
            >
              🎟️ Buy Ticket
            </button>

            <div class="like-container">
              <svg
                class="heart"
                [class.liked]="e.liked"
                (click)="nbLike(e)"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="24"
                height="24"
                fill="currentColor"
              >
                <path
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 
                    2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 
                    3.41 0.81 4.5 2.09C13.09 3.81 14.76 3 
                    16.5 3 19.58 3 22 5.42 22 8.5c0 
                    3.78-3.4 6.86-8.55 11.54L12 
                    21.35z"
                />
              </svg>
              <span>{{ e.nbLike }}</span>
            </div>
          </div>
        </div>

        <a [routerLink]="['./details', e.id]" class="details-link">
          → More Details
        </a>
      </div>
