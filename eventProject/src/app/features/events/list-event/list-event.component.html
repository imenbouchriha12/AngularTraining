<div class="events-container">
  <!-- 🔍 Barre de recherche -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="🔍 Rechercher un événement..."
      [(ngModel)]="searchText"
      class="search-input"
    />
  </div>

  <!-- 🪧 Liste des cartes -->
  <div class="cards-container">
    <app-card-event class="card" *ngFor="let event of search()" [e]="event" (notifLike)="nbLike(event)" (nbPlaces)="nbPlace(event)">
    
    </app-card-event>
  </div>
</div>
